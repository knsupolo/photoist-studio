<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="cache-control" content="no-cache" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta property="og:title" content="PHOTOIST DIGITAL SERVICE" />
  <meta property="og:description" content="촬영 후 24시간 동안 고화질 사진과 영상을 다운로드하실 수 있습니다." />
  <title>PHOTOIST - 사진 및 영상 다운로드</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      min-height: 100%;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      color: #2c2018;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.8), transparent 40%),
        linear-gradient(180deg, #efe6dc 0%, #dcc9b7 100%);
    }
    body {
      padding: 16px;
    }
    .page {
      width: min(100%, 540px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 30px;
    }
    /* 상단 히어로 헤더 */
    .hero {
      margin-top: 4px;
      padding: 24px 20px 22px;
      border-radius: 28px;
      background: linear-gradient(180deg, #4a3427 0%, #291c15 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(45, 25, 12, 0.25);
      text-align: center;
      position: relative;
    }
    .brand-logo {
      display: inline-block;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #fffaf5;
      text-transform: uppercase;
      margin-bottom: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .brand-logo span {
      color: #f43f5e;
      font-size: 13px;
      vertical-align: top;
      margin-left: 2px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .hero-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: rgba(255, 246, 238, 0.65);
      margin-bottom: 12px;
    }
    .hero-time {
      font-size: 24px;
      line-height: 1.2;
      font-weight: 800;
      color: #fffaf5;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    .hero-timezone {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 246, 238, 0.7);
      margin-bottom: 10px;
    }
    .notice {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255, 246, 238, 0.85);
    }
    .notice strong {
      color: #ffd6b8;
      font-weight: 800;
    }
    /* 다국어 선택기 */
    .language-switcher {
      position: absolute;
      top: 16px;
      right: 16px;
    }
    .language-select-wrap {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 8px;
      border-radius: 10px;
      background: rgba(255, 250, 244, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .language-select {
      border: 0;
      background: transparent;
      color: #fffaf5;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    .language-select option {
      background: #3c291d;
      color: #fff;
    }
    /* 카드 컨테이너 */
    .card {
      padding: 16px;
      border-radius: 28px;
      background: rgba(255, 252, 248, 0.95);
      border: 1px solid rgba(116, 81, 53, 0.12);
      box-shadow: 0 16px 40px rgba(60, 34, 18, 0.12);
      backdrop-filter: blur(10px);
    }
    /* 미디어 뷰어 프레임 */
    .viewer {
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(135deg, #f6ede3 0%, #e9dacb 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #photoView, #videoView {
      display: block;
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 18px;
    }
    #videoView {
      display: none;
    }
    /* 스피너 */
    .loader {
      position: absolute;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(90, 56, 38, 0.2);
      border-top-color: #5a3826;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* 버튼 그룹 */
    .action-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .download-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .action-button {
      width: 100%;
      border: 1px solid rgba(110, 79, 58, 0.14);
      border-radius: 18px;
      min-height: 80px;
      padding: 14px 10px;
      font-family: inherit;
      text-align: center;
      cursor: pointer;
      background: linear-gradient(180deg, #ffffff 0%, #fdf8f3 100%);
      box-shadow: 0 8px 20px rgba(74, 46, 24, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .action-button:active {
      transform: translateY(2px);
      box-shadow: 0 4px 10px rgba(74, 46, 24, 0.06);
    }
    .action-button .button-title {
      display: block;
      font-size: 16px;
      font-weight: 800;
      color: #3f2719;
      letter-spacing: -0.01em;
    }
    .action-button .button-sub {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #9a7b66;
    }
    /* 대표 강조 버튼 */
    .action-button.primary {
      background: linear-gradient(180deg, #5c3c2a 0%, #382216 100%);
      border-color: rgba(53, 31, 20, 0.3);
      box-shadow: 0 12px 24px rgba(60, 34, 18, 0.2);
    }
    .action-button.primary .button-title {
      color: #fffaf5;
    }
    .action-button.primary .button-sub {
      color: rgba(255, 245, 236, 0.75);
    }
    /* 하단 서브 링크 */
    .secondary-actions {
      display: grid;
      grid-template-columns: 1fr;
      margin-top: 10px;
    }
    .secondary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 48px;
      border-radius: 16px;
      border: 1px solid rgba(184, 136, 96, 0.25);
      background: linear-gradient(180deg, #fff7ed 0%, #faecd9 100%);
      color: #5a3826;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }
    .thanks {
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      color: #6d5849;
    }
  </style>
</head>
<body onload="initViewer();">
  <main class="page">
    <!-- 헤더 -->
    <section class="hero">
      <div class="brand-logo">PHOTOIST<span>PRO</span></div>
      <p class="hero-eyebrow">DIGITAL SERVICE</p>
      <div class="hero-time" id="shotTimeText">-</div>
      <div class="hero-timezone" id="timezoneText">한국시간 기준 · KST</div>
      <p class="notice" id="noticeText"></p>
      
      <div class="language-switcher">
        <label class="language-select-wrap" for="languageSelect">
          <select class="language-select" id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
          </select>
        </label>
      </div>
    </section>

    <!-- 뷰어 및 다운로드 카드 -->
    <section class="card">
      <div class="viewer">
        <div class="loader" id="viewerLoader"></div>
        <img id="photoView" alt="PHOTOIST PHOTO" onload="hideLoader()" />
        <video id="videoView" preload="auto" loop autoplay muted playsinline></video>
      </div>

      <!-- 영상이 함께 있을 경우 활성화되는 사진/영상 전환 버튼 -->
      <div class="action-stack" id="toggleActionStack" style="display: none;">
        <button class="action-button primary" onclick="toggleMediaMode()">
          <span class="button-title" id="toggleTitle">영상 보기</span>
          <span class="button-sub" id="toggleSub">움직이는 영상으로 보기</span>
        </button>
      </div>

      <!-- 다운로드 버튼 그리드 -->
      <div class="download-grid">
        <button class="action-button primary" id="btnDownloadPhoto" onclick="downloadPhoto()">
          <span class="button-title" id="photoTitle">촬영 사진</span>
          <span class="button-sub" id="photoSub">고화질 사진 저장</span>
        </button>
        <button class="action-button" id="btnDownloadVideo" onclick="downloadVideo()" style="display: none;">
          <span class="button-title" id="videoTitle">무빙 영상</span>
          <span class="button-sub" id="videoSub">15Mbps 영상 저장</span>
        </button>
      </div>

      <div class="secondary-actions">
        <a class="secondary-link" href="./index.html">
          <span>✨ 포토이스트 스튜디오 홈으로</span>
        </a>
      </div>
    </section>

    <section class="thanks">
      <div id="thanksText">포토이스트를 이용해 주셔서 감사합니다.</div>
    </section>
  </main>

  <script>
    // URL 파라미터 파싱 (?p=사진ID & v=영상ID & t=타임스탬프 또는 ?id=사진ID)
    const urlParams = new URLSearchParams(window.location.search);
    const photoId = urlParams.get('p') || urlParams.get('id') || '';
    const videoId = urlParams.get('v') || '';
    const rawTime = urlParams.get('t') || '';

    // 구글 드라이브 고속 스트리밍 주소 매핑
    const photoCdnUrl = photoId ? `https://lh3.googleusercontent.com/d/${photoId}` : '';
    const videoCdnUrl = videoId ? `https://drive.google.com/uc?export=download&id=${videoId}` : '';

    let isVideoMode = false;
    let currentLang = 'ko';

    const i18n = {
      ko: {
        timezone: '한국시간 기준 · KST',
        notice: '촬영 후 <strong>24시간</strong> 동안 다운로드하실 수 있습니다.',
        togglePhoto: '사진 보기',
        togglePhotoSub: '정지 사진으로 보기',
        toggleVideo: '영상 보기',
        toggleVideoSub: '움직이는 영상으로 보기',
        photo: '촬영 사진',
        photoSub: '고화질 사진 저장',
        video: '무빙 영상',
        videoSub: '모션 영상 저장',
        thanks: '포토이스트를 이용해 주셔서 감사합니다.'
      },
      en: {
        timezone: 'Korea Standard Time · KST',
        notice: 'You can download it for <strong>24 hours</strong> after the shoot.',
        togglePhoto: 'Photo View',
        togglePhotoSub: 'View still photo',
        toggleVideo: 'Video View',
        toggleVideoSub: 'View moving video',
        photo: 'Save Photo',
        photoSub: 'Download high-res photo',
        video: 'Save Video',
        videoSub: 'Download moving clip',
        thanks: 'Thank you for choosing PHOTOIST.'
      },
      ja: {
        timezone: '韓国時間基準 · KST',
        notice: '撮影後 <strong>24時間</strong> ダウンロードできます。',
        togglePhoto: '写真を見る',
        togglePhotoSub: '写真表示に切り替え',
        toggleVideo: '動画を見る',
        toggleVideoSub: '動画表示に切り替え',
        photo: '撮影写真',
        photoSub: '高画質写真を保存',
        video: '動画保存',
        videoSub: 'モーション動画を保存',
        thanks: 'PHOTOISTをご利用いただきありがとうございます。'
      },
      zh: {
        timezone: '以韩国时间为准 · KST',
        notice: '拍摄后可在 <strong>24小时</strong> 内下载。',
        togglePhoto: '查看照片',
        togglePhotoSub: '切换为静态照片',
        toggleVideo: '查看视频',
        toggleVideoSub: '切换为动态视频',
        photo: '下载照片',
        photoSub: '保存高清相片',
        video: '下载视频',
        videoSub: '保存动态影像',
        thanks: '感谢您使用 PHOTOIST。'
      }
    };

    function initViewer() {
      // 1. 언어 자동 감지
      const navLang = (navigator.language || '').toLowerCase();
      if (navLang.startsWith('en')) currentLang = 'en';
      else if (navLang.startsWith('ja')) currentLang = 'ja';
      else if (navLang.startsWith('zh')) currentLang = 'zh';
      document.getElementById('languageSelect').value = currentLang;

      // 2. 미디어 로드
      if (photoCdnUrl) {
        document.getElementById('photoView').src = photoCdnUrl;
      } else {
        hideLoader();
      }

      // 3. 비디오가 전달된 경우에만 영상 모드 및 다운로드 버튼 표시
      if (videoId) {
        document.getElementById('toggleActionStack').style.display = 'block';
        document.getElementById('btnDownloadVideo').style.display = 'block';
        const vView = document.getElementById('videoView');
        vView.src = videoCdnUrl;
      }

      renderUI();
    }

    function hideLoader() {
      const loader = document.getElementById('viewerLoader');
      if (loader) loader.style.display = 'none';
    }

    function renderUI() {
      const t = i18n[currentLang] || i18n.ko;
      document.getElementById('timezoneText').textContent = t.timezone;
      document.getElementById('noticeText').innerHTML = t.notice;
      document.getElementById('photoTitle').textContent = t.photo;
      document.getElementById('photoSub').textContent = t.photoSub;
      document.getElementById('videoTitle').textContent = t.video;
      document.getElementById('videoSub').textContent = t.videoSub;
      document.getElementById('thanksText').textContent = t.thanks;
      document.getElementById('shotTimeText').textContent = formatShotTime(rawTime, currentLang);
      updateToggleButtonText();
    }

    function updateToggleButtonText() {
      const t = i18n[currentLang] || i18n.ko;
      if (isVideoMode) {
        document.getElementById('toggleTitle').textContent = t.togglePhoto;
        document.getElementById('toggleSub').textContent = t.togglePhotoSub;
      } else {
        document.getElementById('toggleTitle').textContent = t.toggleVideo;
        document.getElementById('toggleSub').textContent = t.toggleVideoSub;
      }
    }

    function toggleMediaMode() {
      const pView = document.getElementById('photoView');
      const vView = document.getElementById('videoView');
      if (isVideoMode) {
        // 사진으로 전환
        vView.pause();
        vView.style.display = 'none';
        pView.style.display = 'block';
        isVideoMode = false;
      } else {
        // 영상으로 전환
        pView.style.display = 'none';
        vView.style.display = 'block';
        vView.play();
        isVideoMode = true;
      }
      updateToggleButtonText();
    }

    function changeLanguage(lang) {
      currentLang = lang;
      renderUI();
    }

    // 촬영 일시 포맷팅 (YYYYMMDDHHmmss)
    function formatShotTime(ts, lang) {
      if (!ts || ts.length < 12) {
        const now = new Date();
        return `${now.getFullYear()}. ${String(now.getMonth() + 1).padStart(2, '0')}. ${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      }
      const y = ts.substring(0, 4);
      const m = ts.substring(4, 6);
      const d = ts.substring(6, 8);
      const h = ts.substring(8, 10);
      const min = ts.substring(10, 12);
      return `${y}. ${m}. ${d} ${h}:${min}`;
    }

    // 모바일 앨범 직결 다운로드 엔진 (Blob -> Virtual Anchor Trigger)
    async function downloadBlob(url, fileName) {
      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('Fetch failed');
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
      } catch (err) {
        // 모바일 브라우저 CORS 제한 시 새창 다이렉트 다운로드로 안전하게 우회
        window.open(url, '_blank');
      }
    }

    function downloadPhoto() {
      const fileName = `PHOTOIST_${rawTime || Date.now()}_Photo.jpg`;
      const directDownload = `https://drive.google.com/uc?export=download&id=${photoId}`;
      downloadBlob(photoCdnUrl, fileName).catch(() => {
        window.location.href = directDownload;
      });
    }

    function downloadVideo() {
      if (!videoId) return;
      const fileName = `PHOTOIST_${rawTime || Date.now()}_Video.mp4`;
      downloadBlob(videoCdnUrl, fileName).catch(() => {
        window.location.href = videoCdnUrl;
      });
    }
  </script>
</body>
</html>
